":"wood","kind":"text"},{"id":"a089","cat":"木彫・日本画・洋画","q":"丸刀が向いている表現は？","answer":"丸みのある溝や面","options":["大きな板の切断だけ","丸みのある溝や面","色塗り","完全な直線だけ"],"explain":"刃先が曲線状で、柔らかな溝を作れる。","image":"wood","kind":"text"},{"id":"a090","cat":"木彫・日本画・洋画","q":"三角刀の特徴は？","answer":"V字の細い溝を彫りやすい","options":["丸い穴しか作れない","絵具を飛ばす","V字の細い溝を彫りやすい","紙を二つ折りにする"],"explain":"線状の彫り跡に向く。","image":"wood","kind":"text"},{"id":"a091","cat":"木彫・日本画・洋画","q":"平刀が向いているのは？","answer":"広い面を平らに削る","options":["色を点で置く","広い面を平らに削る","線を縫う","紙を濡らす"],"explain":"広い面や角を整えるのに使う。","image":"wood","kind":"text"},{"id":"a092","cat":"木彫・日本画・洋画","q":"彫刻刀を使うときの基本的な注意は？","answer":"刃の進む先に手を置かない","options":["刃先を自分へ向ける","手で材料を空中に持つ","刃の進む先に手を置かない","急いで強く押す"],"explain":"けが防止のため材料を固定し、刃先に指を置かない。","image":"wood","kind":"text"},{"id":"a093","cat":"木彫・日本画・洋画","q":"木目とは？","answer":"木材の繊維が作る模様や方向","options":["紙の厚さ","木材の繊維が作る模様や方向","絵具の色名","彫刻刀の長さ"],"explain":"木目の方向を意識すると彫りやすくなる。","image":"wood","kind":"text"},{"id":"a094","cat":"木彫・日本画・洋画","q":"日本画で伝統的によく使う顔料は？","answer":"岩絵具","options":["印刷インクだけ","岩絵具","アクリル板","鉛筆芯だけ"],"explain":"岩絵具や墨などを用いる表現がある。","image":"wood","kind":"text"},{"id":"a095","cat":"木彫・日本画・洋画","q":"洋画の代表的な画材は？","answer":"油絵具","options":["毛糸だけ","油絵具","版木だけ","彫刻刀だけ"],"explain":"油絵具などを用いた絵画が代表例。","image":"wood","kind":"text"},{"id":"a096","cat":"木彫・日本画・洋画","q":"水墨画が主に生かす表現は？","answer":"墨の濃淡やにじみ","options":["写真のピクセル","印刷機の速度","金属の光沢だけ","墨の濃淡やにじみ"],"explain":"墨の濃さと水分で幅広い表情を作る。","image":"wood","kind":"text"},{"id":"a097","cat":"木彫・日本画・洋画","q":"木彫の「彫り残し」を考える理由は？","answer":"立体の形を壊さずに仕上げるため","options":["紙を節約するため","絵具の乾燥を早めるため","立体の形を壊さずに仕上げるため","音を出すため"],"explain":"削った木は元に戻らないため、計画的に形を出す。","image":"wood","kind":"text"},{"id":"a098","cat":"木彫・日本画・洋画","q":"木彫で立体感を出す基本は？","answer":"高さ・奥行き・面の変化","options":["高さ・奥行き・面の変化","図形の名前だけ","紙の色だけ","文字の数だけ"],"explain":"深さや面の向きで光と影が変わる。","image":"wood","kind":"text"}]}};

<script>
(() => {
  'use strict';
  const DATA = window.MANABI_DATA;
  const app = document.querySelector('#app');
  if (!DATA || !app) { document.body.textContent = '問題データが読み込めませんでした。ページを再読み込みしてください。'; return; }
  const STORE='manabi-step-state-v1';
  const SUBJECTS={math:'数学',art:'美術'};
  const CATS={math:['グラフ','変化の割合','直線の式','グラフ読取','式とグラフ','応用問題'],art:['浮世絵','ジャポニスム','印象派・西洋美術','モダンテクニック','空想・錯覚','木彫・日本画・洋画']};
  const artworks=Object.fromEntries(DATA.artworks.map(w=>[w.id,w]));
  const questionMap=Object.fromEntries(Object.entries(DATA.subjects).flatMap(([subject,arr])=>arr.map(q=>[q.id,{...q,subject}])));
  let state=loadState(),page='home',subject='math',session=null;
  function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE)||'{}');return {records:Array.isArray(s.records)?s.records.filter(r=>r && typeof r.id==='string' && questionMap[r.id]).slice(-10000):[],session:s.session&&Array.isArray(s.session.ids)?s.session:null,seen:Array.isArray(s.seen)?s.seen.slice(-100):[]}}catch{return {records:[],session:null,seen:[]}}}
  function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{alert('この端末に学習記録を保存できませんでした。設定でバックアップを利用してください。')}}
  const escape = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = d => new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Tokyo'}).format(d).replaceAll('/','-');
  const today = () => fmtDate(new Date());
  function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
  function getRecords(sub){return sub?state.records.filter(r=>questionMap[r.id]?.subject===sub):state.records}
  function recentQuestion(q){return [...state.records].reverse().find(r=>r.id===q.id)}
  function grade(sub,cat){const samples=getRecords(sub).filter(r=>questionMap[r.id]?.cat===cat).slice(-18);if(!samples.length)return null;return Math.round(samples.filter(r=>r.correct).length/samples.length*100)}
  function rates(sub){return CATS[sub].map(cat=>({cat,value:grade(sub,cat)}))}
  function choose(count,pool){const seen=new Set(state.seen.slice(-24));const scored=pool.map(q=>{const history=getRecords().filter(r=>r.id===q.id).slice(-4);const wrong=history.filter(r=>!r.correct).length;let weight=1+(wrong*1.8);if(!history.length)weight+=2.6;if(seen.has(q.id))weight*=.18;return {q,score:-Math.log(Math.max(.00001,Math.random()))/Math.max(.01,weight)}});scored.sort((a,b)=>a.score-b.score);return scored.slice(0,count).map(x=>x.q)}
  function makeSet(sub,mode){const all=DATA.subjects[sub],isArt=sub==='art';let picked=[];
    if(mode==='wrong'){const wrongIDs=new Set(getRecords(sub).filter(r=>!r.correct).map(r=>r.id));const improvedIDs=new Set(getRecords(sub).filter(r=>r.correct).map(r=>r.id));const wrongPool=all.filter(q=>wrongIDs.has(q.id) && (!improvedIDs.has(q.id)||recentQuestion(q)?.correct===false));if(!wrongPool.length)return null;picked=choose(Math.min(10,wrongPool.length),wrongPool)}

  document.body.addEventListener('change',e=>{if(e.target.id==='importFile'){importData(e.target.files?.[0]);e.target.value=''}});
  document.querySelector('#closeImage')?.addEventListener('click',()=>document.querySelector('#imageDialog').close());
  document.querySelector('#imageDialog')?.addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close()});
  if(state.session?.ids?.length&&!state.session.done&&state.session.sub in SUBJECTS){session=state.session;subject=session.sub}
  render();
})();

</script>
</body>
</html>
