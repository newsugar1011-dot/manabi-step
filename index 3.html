/* 学習ポイントと報酬達成を見える化 */
.reward-panel{margin:0 0 18px;padding:23px;border-radius:21px;background:linear-gradient(125deg,#173a53,#156773 72%,#1b827a);color:#fff;box-shadow:0 14px 28px rgba(13,66,84,.15)}
.reward-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.reward-overline{color:#b5e6e2;letter-spacing:.12em;font-size:.75rem;font-weight:850}
.reward-panel h2{color:#fff;font-size:1.15rem;margin:2px 0 0}
.reward-level{display:inline-flex;padding:7px 13px;border:1px solid #aad9dc;border-radius:99px;background:#ffffff1a;font-weight:850;white-space:nowrap}
.reward-main{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:19px 0 17px}
.reward-metric{border-radius:13px;background:#ffffff15;padding:11px 14px;min-width:0}
.reward-metric span{font-size:.78rem;color:#c4eee9;display:block}
.reward-metric strong{font-size:clamp(1.65rem,4vw,2.3rem);font-weight:950;line-height:1.35;display:block}
.reward-metric small{font-size:.77rem;font-weight:650;color:#d6f7f3}
.reward-track{height:15px;border-radius:99px;background:#ffffff38;overflow:hidden;margin:7px 0}
.reward-fill{height:100%;background:linear-gradient(90deg,#7de5d0,#f4d66f);border-radius:99px;transition:width .3s}
.reward-between{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.83rem;font-weight:700;color:#e1fbf6}
.reward-mission{background:#ffffff15;border-radius:12px;padding:10px 14px;margin-top:15px}
.reward-mission-title{display:flex;justify-content:space-between;gap:8px;font-size:.87rem;font-weight:750}
.reward-mission .progress-track{margin-top:7px;background:#ffffff38}
.reward-mission .progress-fill{background:#f3d476}
.reward-note{font-size:.76rem;line-height:1.6;color:#d6f3f0;margin:13px 0 0}
.reward-unlock{border-radius:17px;background:linear-gradient(130deg,#fff5d5,#f7e7b5);border:2px solid #d7a92e;color:#684b0b;padding:18px;text-align:center;margin:17px 0;box-shadow:0 9px 22px rgba(144,108,38,.1)}
.reward-unlock strong{font-size:1.5rem;font-weight:900;display:block}
.reward-gain{display:inline-block;border-radius:99px;background:#147f53;color:#fff;padding:7px 14px;font-weight:900;font-size:1.05rem;margin:9px 0;animation:pointPop .35s ease-out both}
.reward-gain.mission{background:#aa6d10}
.reward-help{padding:10px 14px;border:1px solid #dce7e8;background:#f7fbfa;border-radius:12px;margin:12px 0 0;color:#42606a;font-size:.81rem}
@keyframes pointPop{from{opacity:.3;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.reward-gain{animation:none}.reward-fill{transition:none}}
@media(max-width:480px){.reward-panel{padding:18px}.reward-main{gap:9px;margin:14px 0}.reward-metric{padding:10px}.reward-metric strong{font-size:1.62rem}.reward-between{font-size:.78rem}}

/* v4.1：正誤は選択肢の○×で確認。大きな不正解バナーを削除 */
.feedback.bad{background:#f4f8f7;border-color:#d5e4e0}

.recall-progress{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.recall-stat{background:#f6f9f8;border-radius:12px;padding:12px;text-align:center}

.recall-track{height:10px;border-radius:99px;background:#e3edeb;overflow:hidden;margin-top:12px}

,{"id":"v61-social-004","cat":"関東地方","q":"都心の気温が周辺より高くなる現象は？","answer":"ヒートアイランド現象","options":["ヒートアイランド現象","フェーン現象","都市のドーナツ化現象","温室効果"],"explain":"人工排熱や舗装面などが原因","kind":"text"},{"id":"v61-social-005","cat":"関東地方","q":"ヒートアイランド現象が起きる理由を二つ書きなさい。","answer":"人工排熱が多く緑地が少ないから","options":["人工排熱が多く緑地が少ないから","人工排熱が少なく緑地が多いから","海風が強く吹き続けるから","都市の建物が少なく日陰が増えるから"],"explain":"建物・道路の蓄熱も原因","kind":"text"},{"id":"v61-social-006","cat":"関東地方","q":"郊外に住宅地が無秩序に広がる現象は？","answer":"スプロール現象","options":["スプロール現象","ドーナツ化現象","ヒートアイランド現象","都市の再開発"],"explain":"都市計画の課題","kind":"text"},{"id":"v61-social-007","cat":"関東地方","q":"都市の周辺に発達した住宅中心の都市を何という？","answer":"ベッドタウン","options":["ベッドタウン","ニュータウン","ターミナル駅","中心業務地区"],"explain":"都心への通勤者が多い","kind":"text"},{"id":"v61-social-008","cat":"関東地方","q":"東京の都心に人や会社が集まる理由を説明しなさい。","answer":"政治や経済や交通の中心機能が集中しているから","options":["政治や経済や交通の中心機能が集中しているから","農業や林業が集中しているから","都心では交通機関がほとんど利用されないから","工場の敷地が広く住宅が集中しているから"],"explain":"本社・官庁・交通網など","kind":"text"},{"id":"v61-social-009","cat":"関東地方","q":"東京の副都心である代表的な地区を三つ書きなさい。","answer":"新宿・渋谷・池袋","options":["新宿・渋谷・池袋","品川・上野・浅草","横浜・川崎・千葉","銀座・日本橋・丸の内"],"explain":"いずれも主要ターミナル","kind":"text"},{"id":"v61-social-010","cat":"関東地方","q":"鉄道路線が集中し乗り換えの拠点となる駅は？","answer":"ターミナル駅","options":["ターミナル駅","貨物駅","新幹線の車両基地","終着駅"],"explain":"新宿駅など","kind":"text"},{"id":"v61-social-011","cat":"関東地方","q":"東京に国の行政機関が集まることを示す役割は？","answer":"政治の中心","options":["政治の中心","工業の中心","農業の中心","水産業の中心"],"explain":"国会や中央省庁が集まる","kind":"text"},{"id":"v61-social-012","cat":"関東地方","q":"関東地方の人口が集中する地域は？","answer":"東京大都市圏","options":["東京大都市圏","関東平野","東京湾沿岸","北関東工業地域"],"explain":"東京・神奈川・埼玉・千葉など","kind":"text"},{"id":"v61-social-013","cat":"関東地方","q":"関東地方を流れる流域面積が日本最大の川は？","answer":"利根川","options":["利根川","信濃川","荒川","多摩川"],"explain":"関東平野を流れる","kind":"text"},{"id":"v61-social-014","cat":"関東地方","q":"関東地方に広がる日本最大の平野は？","answer":"関東平野","options":["関東平野","濃尾平野","石狩平野","越後平野"],"explain":"東京を含む広い平野","kind":"text"},{"id":"v61-social-015","cat":"関東地方","q":"茨城県つくば市 nt to make use of this experience in my future life.","I want making use this experience in my future life.","I want to make use this experience at my future life."],"explain":"make use of は「…を活用する」。","kind":"text","priority":true},{"id":"priority-20261107-english-035","cat":"PROGRAM 5 職場体験","q":"What did you talk about? の意味は？","answer":"何について話しましたか。","options":["いつ話しましたか。","何について話しましたか。","だれに話しましたか。","どうやって話しましたか。"],"explain":"talk about は「…について話す」。","kind":"text","priority":true}]}};

<script>
(() => {
  'use strict';
  const DATA = window.MANABI_DATA;
  const app = document.querySelector('#app');
  if (!DATA || !app) { document.body.textContent = '問題データが読み込めませんでした。ページを再読み込みしてください。'; return; }
  const STORE='manabi-step-state-v1';
  const SUBJECTS={math:'数学',art:'美術',social:'社会',health:'保健体育',homeec:'家庭科',english:'英語'};
  const CATS={math:['グラフ','変化の割合','直線の式','グラフ読取','式とグラフ','応用問題'],art:['浮世絵','ジャポニスム','印象派・西洋美術','モダンテクニック','空想・錯覚','木彫・日本画・洋画'],social:['関東地方','東北地方','北海道','宗教・大航海','戦国・統一','桃山文化'],health:['犯罪の防止','自然災害','避難行動','防災準備','情報の活用','安全な生活'],homeec:['五大栄養素','栄養と健康','食品群','献立と食生活','調理の基本','食品衛生'],english:['不定詞・基本','不定詞・応用','比較級','最上級・同等比較','会話表現','読解・英作文']};
  const artworks=Object.fromEntries(DATA.artworks.map(w=>[w.id,w]));
  const questionMap=Object.fromEntries(Object.entries(DATA.subjects).flatMap(([subject,arr])=>arr.map(q=>[q.id,{...q,subject}])));
  let state=loadState(),page='home',subject='math',session=null,lotteryAnimating=false;
  function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE)||'{}');return {records:Array.isArray(s.records)?s.records.filter(r=>r && typeof r.id==='string' && questionMap[r.id]).slice(-10000):[],session:s.session&&Array.isArray(s.session.ids)?s.session:null,seen:Array.isArray(s.seen)?s.seen.slice(-100):[],draws:Array.isArray(s.draws)?s.draws.filter(d=>d&&typeof d.id==='string'&&Number.isInteger(d.slot)&&d.slot>=0&&typeof d.prize==='string').slice(0,1000):[]}}catch{return {records:[],session:null,seen:[],draws:[]}}}
  function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{alert('この端末に学習記録を保存できませんでした。設定でバックアップを利用してください。')}}
  const escape = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = d => new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Tokyo'}).format(d).replaceAll('/','-');
  const today = () => fmtDate(new Date());
  function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
  function getRecords(sub){return state.records.filter(r=>(r.mode!=='blind'||r.selfGraded===true)&&(!sub||questionMap[r.id]?.subject===sub))}
  function recentQuestion(q){return [...state.records].reverse().find(r=>r.id===q.id)}
  function grade(sub,cat){const samples=getRecords(sub).filter(r=>questionMap[r.id]?.cat===cat).slice(-18);if(!samples.length)return null;return Math.round(samples.filter(r=>r.correct).length/samples.length*100)}
  function rates(sub){return CATS[sub].map(cat=>({cat,value:grade(sub,cat)}))}
  // 旧版の履歴は「4択での学習」として扱う。段階は記録から再構築する。
  const STAGE_LABEL={choice:'4択式',hint:'4択式',write:'4択式'};
  const LEVELS=['choice','hint','write'];
  function stageInfo(id){
    const rows=getRecords().filter(r=>r.id===id).slice(-150);
    let level=0,freeDays=new Set(),mastered=false;
    for(const r of rows){
      const m=LEVELS.includes(r.mode)?r.mode:'choice';
      if(r.correct){
        if(m==='choice')level=Math.max(level,1);
        if(m==='hint')level=Math.max(level,(r.hintsUsed||0)>=2?1:2);
        if(m==='write'){
          level=2;
          const date=String(r.at||'').slice(0,10);
          if(date)freeDays.add(date);
          mastered=freeDays.size>=2;
        }
      }else{
        level=Math.max(0,level-1);
        freeDays=new Set();mastered=false;
      }
    }
    return {level:LEVELS[level],mastered,freeDays:freeDays.size,attempts:rows.length};
  }
  function stageSummary(sub){
    const qs=DATA.subjects[sub],info=qs.map(q=>stageInfo(q.id));
    return {first:info.filter(x=>x.level==='choice').length,hint:info.filter(x=>x.level==='hint').length,write:info.filter(x=>x.level==='write').length,mastered:info.filter(x=>x.mastered).length,total:qs.length};
  }
  function stagePanel(){
    const summaries=Object.entries(SUBJECTS).map(([key,name])=>[name,stageSummary(key)]);
    return `<section class="card" style="margin-bottom:18px"><div class="flex between" style="align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">✍️ 記述にステップアップ</h2><span class="stage-chip">4択 → ヒント → 記述</span></div>
       <p class="subtle tiny" style="margin:10px 0">自分で思い出して書ける問題を少しずつ増やそう。2日にわたってヒントなし正解できれば「定着」！</p>
       ${summaries.map(([name,r])=>`<div style="margin-top:12px"><div class="flex between"><strong>${name}</strong><span class="tiny subtle">記述に進んだ問題 ${r.write} / ${r.total}問　・　定着 ${r.mastered}問</span></div><div class="recall-track"><span style="width:${Math.round(r.write/r.total*100)}%"></span></div></div>`).join('')}
    </section>`;
  }
  function normalizeWritten(value){
    return String(value||'').normalize('NFKC').toLowerCase().replace(/[\s\u3000「」『』"'。、・，,.!！?？:：=＝()（）\[\]【】]/g,'').replace(/[−－‐–—ー]/g,'-');
  }
  const ALIASES={
    '葛飾北斎':['北斎'],'歌川広重':['広重'],'喜多川歌麿':['歌麿'],'東洲斎写楽':['写楽'],
    'フィンセント・ファン・ゴッホ':['ゴッホ','ファンゴッホ'],
    'クロード・モネ':['モネ'],'ジョルジュ・スーラ':['スーラ'],
    'ジャン＝フランソワ・ミレー':['ミレー'],'ピエール＝オーギュスト・ルノワール':['ルノワール'],
    'ポール・セザンヌ':['セザンヌ'],'木版多色刷り':['多色木版刷り','多色木版画','錦絵'],
    '多色刷りの木版画':['錦絵','木版多色刷り','多色木版画'],
    '浮世絵など':['浮世絵'],'印象・日の出':['印象日の出']
  };
  function linearEquation(value){
    let t=String(value||'').normalize('NFKC').replace(/[\s\u3000]/g,'').replace(/[−－‐–—]/g,'-');
    const p=t.split('=');if(p.length!==2)return null;
    let expr=p[0].toLowerCase()==='y'?p[1]:p[1].toLowerCase()==='y'?p[0]:null;
    if(expr===null)return null;
    expr=expr.toLowerCase().replace(/[×＊*]/g,'').replace(/-/g,'+-');
    let m=0,b=0;
    const parts=expr.split('+').filter(Boolean);if(!parts.length)return null;
    for(const term of parts){
      if(/^[-]?(?:\d+(?:\.\d+)?)?x$/.test(term)){
        const c=term.slice(0,-1);m+=c===''?1:c==='-'?-1:Number(c);
      }else if(/^-?\d+(?:\.\d+)?$/.test(term))b+=Number(term);
      else return null;
    }
    return [m,b];
  }
  function exactWrittenMatch(input,q){
    const actual=normalizeWritten(input),target=normalizeWritten(q.answer);
    if(!actual)return false;
    if(actual===target)return true;
    if((ALIASES[q.answer]||[]).some(x=>normalizeWritten(x)===actual))return true;
    if(q.subject==='math'){
      if(/^[-+]?\d+(?:\.\d+)?$/.test(target)){
        const num=actual.replace(/(円|km|cm|l|度|℃|枚|本|個|人|時間|分)$/i,'');
        return /^[-+]?\d+(?:\.\d+)?$/.test(num)&&Number(num)===Number(target);
      }
      const a=linearEquation(input),b=linearEquation(q.answer);
      if(a&&b&&a[0]===b[0]&&a[1]===b[1])return true;
    }
    return false;
  }
  function recallQuestion(q,level){
    if(level==='choice')return q.q;
    return q.q.replace('この作品の名前はどれ？','この作品の名前を書こう。')
      .replace('グラフの直線を表す式はどれ？','グラフの直線を表す式を書こう。')
      .replace(/はどれ？$/,'を書こう。').replace(/どれが正しい？$/,'正しい答えを書こう。');
  }
  function answerHint(q,step){
    if(step===1)return `分野は「${q.cat}」。答えは ${[...String(q.answer)].length} 文字程度です。`;
    const letters=[...String(q.answer)],n=Math.max(1,Math.floor(letters.length/3));
    return `文字のヒント：${letters.map((x,i)=>i<n?escape(x):(/[\s・＝=+\-（）()]/.test(x)?escape(x):'○')).join('')}`;
  }
  function quizLevel(q){return 'choice'}
  function sessionCorrect(id){return session?.results?.[id]??(session?.answers?.[id]===questionMap[id]?.answer)}

  function choose(count,pool){const seen=new Set(state.seen.slice(-24));const scored=pool.map(q=>{const history=getRecords().filter(r=>r.id===q.id).slice(-4);const wrong=history.filter(r=>!r.correct).length;let weight=(q.priority?5:1)+(wrong*1.8);if(!history.length)weight+=2.6;if(seen.has(q.id))weight*=.18;return {q,score:-Math.log(Math.max(.00001,Math.random()))/Math.max(.01,weight)}});scored.sort((a,b)=>a.score-b.score);return scored.slice(0,count).map(x=>x.q)}
  function makeSet(sub,mode){const all=DATA.subjects[sub],isArt=sub==='art';let picked=[];
    if(mode==='wrong'){const wrongIDs=new Set(getRecords(sub).filter(r=>!r.correct).map(r=>r.id));const improvedIDs=new Set(getRecords(sub).filter(r=>r.correct).map(r=>r.id));const wrongPool=all.filter(q=>wrongIDs.has(q.id) && (!improvedIDs.has(q.id)||recentQuestion(q)?.correct===false));if(!wrongPool.length)return null;picked=choose(Math.min(10,wrongPool.length),wrongPool)}
    else if(isArt && mode==='normal'){
      picked=choose(4,all.filter(q=>q.kind==='image'));
      const chosen=new Set(picked.map(q=>q.id));picked.push(...choose(6,all.filter(q=>q.kind!=='image'&&!chosen.has(q.id))));
    } else picked=choose(10,all);
    return {sub,mode,studyMode:state.studyMode==='blind'?'blind':'choice',revealed:{},ids:shuffle(picked).map(q=>q.id),answers:{},results:{},levels:Object.fromEntries(picked.map(q=>[q.id,'choice'])),hints:{},drafts:{},pending:null,confidence:{},current:0,done:false,created:Date.now(),options:Object.fromEntries(picked.map(q=>[q.id,shuffle(q.options)]))};
  }
  function navigate(to){page=to;render();window.scrollTo(0,0)}
  function start(sub,mode='normal'){const s=makeSet(sub,mode);if(!s){alert('まだ復習対象の問題はありません。通常学習から始めよう！');return}subject=sub;session=s;state.session=s;save();navigate('quiz')}
  function resume(){if(!state.session?.ids?.length)return;session=state.session;subject=session.sub;navigate('quiz')}
  function renderNav(){document.querySelectorAll('[data-nav]').forEach(b=>{const active=b.dataset.nav===page;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')})}
  function sumStats(sub){const rs=getRecords(sub);return {count:rs.length,correct:rs.filter(r=>r.correct).length,percent:rs.length?Math.round(rs.filter(r=>r.correct).length/rs.length*100):null}}
  function home(){const recent=[...state.records].reverse().slice(0,5);return `
    <section class="hero"><p class="hero-overline">READY FOR EXAMS</p><h1>今日の10問から、<br>一歩ずつ伸ばそう。</h1><p>4択式と、声に出して答えるブラインドモードを選べます。毎日10問ずつ！</p></section>
    ${rewardPanel()}
    ${lotteryPanel()}
    
    ${state.session&&!state.session.done?`<section class="card" style="margin-bottom:16px"><div class="flex between"><div><strong>解きかけのセットがあります</strong><div class="subtle tiny">${SUBJECTS[state.session.sub]} ${Object.keys(state.session.answers).length}/${state.session.ids.length}問 回答済み</div></div><button class="btn inline" data-action="resume">つづきから →</button></div></section>`:''}
    <section class="stat-row" aria-label="学習サマリー"><div class="stat"><strong>${state.records.length}</strong><span>累計解答数</span></div><div class="stat"><strong>${streak()}</strong><span>連続学習日数</span></div><div class="stat"><strong>${todayCount()}</strong><span>今日の解答数</span></div></section>
    <div class="section-title"><h2>学習方法を選ぼう</h2></div>
    <section class="study-mode-picker" aria-label="学習モード選択"><button type="button" data-action="study-mode" data-study-mode="choice" class="study-mode-button ${state.studyMode!=='blind'?'selected':''}"><strong>🔘 4択式</strong><small>選択して自動採点・正解で1pt</small></button><button type="button" data-action="study-mode" data-study-mode="blind" class="study-mode-button ${state.studyMode==='blind'?'selected':''}"><strong>🙈 ブラインドモード</strong><small>声に出して答え、自己採点・正解で1pt</small></button></section>
    <div class="section-title"><h2>教科を選んでスタート</h2></div><section class="grid-2">
      ${[['math','📐','一次関数','教科書 P62〜96'],['art','🎨','作品・技法','作品画像あり'],['english','🔤','英作文・文法','PROGRAM 5ワークNo.13〜15を重点'],['social','🌏','地理・歴史','先生の85問プリントを重点出題'],['health','🏃','安全・防災','教科書の安全分野'],['homeec','🍳','栄養・生活','食品・栄養・献立・調理']].map(([s,emoji,topic,sub])=>`<article class="card subject"><div class="subject-icon" aria-hidden="true">${emoji}</div><h3>${SUBJECTS[s]} <span class="pill">${DATA.subjects[s].length}問</span></h3><p class="subtle tiny" style="margin:0">${topic}<br>${sub}</p><div class="start-row"><button class="btn" data-action="start" data-sub="${s}">10問に挑戦 →</button><button class="btn secondary" data-action="modes" data-sub="${s}">復習</button></div><div class="subtle tiny">現在の正答率：${sumStats(s).percent??'未学習'}${sumStats(s).percent===null?'':'%'}</div></article>`).join('')}
    </section>
    <div class="alert">v5の数学・美術は引き継ぎました。社会・保健体育は共有教材を参考に追加。英語・家庭科は教科書写真の単元を反映のため食品・栄養・献立・調理です。美術の作品画像は通信が必要です。</div>
    <div class="section-title"><h2>最近の学習</h2><button class="btn ghost inline" data-action="nav" data-page="report">詳しく見る</button></div>
    <div class="card">${recent.length?recent.map(r=>`<div class="daily-item"><span class="tiny">${escape((r.at||'').slice(0,10))}　${SUBJECTS[questionMap[r.id].subject]}・${escape(questionMap[r.id].cat)}</span><strong style="color:${r.correct?'var(--green)':'var(--red)'}">${r.correct?'正解':'復習しよう'}</strong></div>`).join(''):'<p class="empty">まだ記録はありません。まず10問解いてみよう！</p>'}</div>`}
  function streak(){const days=[...new Set(state.records.map(r=>r.at?.slice(0,10)))].sort().reverse();let n=0;const todayLocal=new Date();let cursor=new Date(Date.UTC(todayLocal.getFullYear(),todayLocal.getMonth(),todayLocal.getDate(),12));if(days[0]!==today()){cursor.setUTCDate(cursor.getUTCDate()-1)}for(let i=0;i<days.length;i++){const date=fmtDate(cursor);if(days.includes(date)){n++;cursor.setUTCDate(cursor.getUTCDate()-1)}else break}return n}
  function todayCount(){return state.records.filter(r=>r.at?.slice(0,10)===today()).length}

  // 履歴から毎回再計算するので、旧版の記録・バックアップをそのまま利用可能。
  // 同じ日・同じ問題の正解は1回だけ加点し、連続タップによるポイント稼ぎを防ぐ。
  function pointStats(){
    const daily=new Map(),credited=new Map();
    for(const r of state.records){
      const day=String(r.at||'').slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!questionMap[r.id])continue;
      daily.set(day,(daily.get(day)||0)+1);
      if(r.correct || (r.mode==='blind' && r.selfGraded!==true)){

  const explanationGuides = {"math":{"グラフ":"① 直線が縦軸と交わる場所を読み、切片 b を決める。② 右に1進んだとき上下にいくつ動くかを読み、傾き a を決める。③ y = ax + b に当てはめる。下向きの直線なら a はマイナス。","変化の割合":"変化の割合 = yの増加量 ÷ xの増加量。xの値そのものではなく、2点間の差を使う。マイナスの符号も忘れない。","直線の式":"一次関数は y = ax + b。a は傾き、b は切片。2点が分かる場合は先に a = (y₂−y₁) ÷ (x₂−x₁) を求め、その後1点を代入して b を決める。","グラフ読取":"座標は必ず (x, y) の順番。横軸を先に、縦軸を後に読む。グラフ上の点を式に代入して確かめるとミスを減らせる。","式とグラフ":"傾きの符号で右上がり・右下がりを判断し、切片で縦軸との交点を確認する。似た式は「傾き」と「切片」を別々に比較しよう。","応用問題":"何を x、何を y とするか先に決め、単位をそろえる。条件から式を作ったら、問題文の数値を代入して確かめよう。"},"english":{"不定詞・基本":"to の後ろは必ず動詞の原形。want to は「〜したい」、to + 動詞は文脈によって「〜するために」「〜すること」「〜するための」に変わる。","不定詞・応用":"不定詞が何を説明しているかを見る。名詞の直後なら「〜するための／〜すべき」、動作の目的なら「〜するために」。動詞の形と語順に注目。","比較級":"2つを比べるときは比較級 + than。短い形容詞は -er、長い形容詞は more を使うことが多い。than の前後で比べる対象を確認。","最上級・同等比較":"最上級は the + 最上級（-est / most）。同じ程度なら as + 原級 + as。比較級と最上級、原級を混同しない。","会話表現":"直前の質問が「何を」「いつ」「どこで」「なぜ」のどれを聞いているか確認する。疑問詞と答えの内容が対応しているかがポイント。","読解・英作文":"主語→動詞→残りの情報の順に並べる。時制・三人称単数・複数形を最後に確認。日本語を単語ごとに直訳せず、英語の語順で組み立てよう。"},"social":{"関東地方":"東京への人口・交通・企業の集中と、周辺県の住宅地や農業・工業の関係をセットで考える。「場所」「原因」「影響」の3点で覚えると説明問題にも強い。","東北地方":"地形・気候と産業を結びつける。太平洋側の冷たい「やませ」、米づくり、果樹栽培、伝統工芸、祭りをそれぞれ区別する。","北海道":"冷涼な気候、広い土地を生かした大規模農業・酪農、漁業、先住民族アイヌの歴史を区別して整理する。地域名と産業の組み合わせに注意。","宗教・大航海":"人物・国・目的・出来事を対応させる。大航海時代の航路、キリスト教の宗派、宗教改革の人物は混同しやすいので、何をした人物かで覚える。","戦国・統一":"信長と秀吉の政策を混同しない。信長は楽市・楽座や鉄砲の活用、秀吉は太閤検地・刀狩など。政策の「目的」まで説明できると得点につながる。","桃山文化":"豪華で力強い文化が特徴。城郭建築、障壁画、茶の湯を、作品・人物・特徴の3点で結びつける。"},"art":{"浮世絵":"作品の見た目を手がかりに作者・題名・技法を結びつける。北斎と広重の作品は特に混同しやすいので構図や主題の違いを見る。","ジャポニスム":"日本の浮世絵などが西洋の画家に与えた影響。大胆な構図、平面的な色彩、画面の切り取り方など、どの表現が影響を受けたかを見る。","印象派・西洋美術":"光・色彩・筆触・描いた場面を手がかりに作者と作品を対応させる。似た絵は色の使い方と構図を比べる。","モダンテクニック":"技法の名前だけでなく「どうやって作るか」を説明できるようにする。こする・吹く・転写する・垂らすなど動作の違いが手がかり。","空想・錯覚":"実際の形と見え方の違いを意識する。錯視は視覚の性質、空想表現は現実にはない組み合わせや発想に注目。","木彫・日本画・洋画":"材料・道具・表現方法の違いを整理する。木彫は彫る順序と刃物の安全、日本画・洋画は画材と表現の特徴がポイント。"},"health":{"犯罪の防止":"危険を避ける→安全な場所へ逃げる→大人や警察に知らせる、の順で考える。自分だけで解決しようとしない。","自然災害":"一次災害（地震・豪雨など）と二次災害（火災・土砂災害など）を区別し、地域ごとの危険を考える。","避難行動":"避難先だけでなく避難経路も確認する。警報や周囲の状況に   function explanationExtra(q){
    const subjectKey = q.subject || Object.keys(window.MANABI_DATA.subjects).find(k=>window.MANABI_DATA.subjects[k].some(item=>item.id===q.id));
    const guide=explanationGuides[subjectKey]?.[q.cat]||'';
    const haystack=String(q.q||'')+' '+String(q.answer||'');
    const entry=(relatedFactBank[subjectKey]||[]).find(([word])=>haystack.includes(word));
    const fact=entry?.[1]||'';
    const related=entry?.[2]||'';
    const blocks=[];
    if(fact && !String(q.explain||'').includes(fact))blocks.push(`<p class="deep-title">📖 解説</p><p>${escape(fact)}</p>`);
    if(related)blocks.push(`<p class="deep-title">📚 関連する知識・ひっかけ注意</p><p>${escape(related)}</p>`);
    if(guide && (!fact || !related))blocks.push(`<p class="deep-title">💡 理解のポイント</p><p>${escape(guide)}</p>`);
    if(!blocks.length)blocks.push(`<p class="deep-title">💡 理解のポイント</p><p>${escape(guide||'問題文のキーワードと正解を結び付けて、理由を自分の言葉で説明できるようにしよう。')}</p>`);
    return `<div class="deep-explanation">${blocks.join('')}</div>`;
  }

      ${session.missionUnlockedAt===q.id?'<p class="reward-help">🎯 10問ミッション達成！ +3 pt を含みます。</p>':''}
      ${session.rewardUnlockedAt===q.id?'<div class="reward-unlock"><strong>🎉 報酬獲得！</strong>100 pt到達！ よく頑張ったね！</div>':''}
      <p><strong>📖 この問題の解説</strong></p><p>${escape(q.explain)}</p>${explanationExtra(q)}${q.image?`<div class="result-image">${picture(q.image,true)}<p class="tiny subtle">${escape(artworks[q.image].name)} ／ ${escape(artworks[q.image].artist)}</p></div>`:''}
      <hr class="divider"><p class="tiny" style="margin-bottom:6px"><strong>回答したときの自信は？</strong></p><div class="confidence-row">${[['sure','自信あり'],['maybe','少し迷った'],['guess','勘で答えた']].map(([key,label])=>`<button data-action="confidence" data-conf="${key}" class="${session.confidence[q.id]===key?'active':''}">${label}</button>`).join('')}</div>
      ${lv!=='choice'&&sessionCorrect(q.id)?`<p class="tiny subtle" style="margin:12px 0 0">${stageInfo(q.id).mastered?'🎓 別の日にもヒントなしで書けた！ 定着できているよ。':lv==='hint'?'次はヒントなしの記述に挑戦！':'後日もう一度書けたら、さらに定着するよ。'}</p>`:''}
      </div>`:'';
    app.innerHTML=`<div class="quiz-top"><div class="flex between"><span class="pill">${SUBJECTS[session.sub]}・${escape(q.cat)}</span><span class="quiz-progress">${session.current+1} / ${session.ids.length}　⭐ ${pointStats().points} pt</span></div><div class="progress-track" style="margin-top:13px"><div class="progress-fill" style="width:${progress}%"></div></div></div>
    <section class="card question-card"><div class="flex between" style="align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px"><span class="stage-chip stage-${steps+1}">${blind?'🙈 ブラインド':STAGE_LABEL[lv]}</span><span class="tiny subtle">${q.kind==='image'?'🖼️ 作品画像':'📝 練習問題'}</span></div>
    <h1 class="question-title">${escape(recallQuestion(q,lv))}</h1>${q.kind==='image'?picture(q.image,false):''}${q.graph?graphPlot(q.graph):''}
    ${blind?(!revealed?`<div class="blind-prompt"><p>選択肢は表示しません。まず声に出して答えてみよう。</p><button class="btn" data-action="blind-reveal">答えと解説を見る</button></div>`:(!answered?`<div class="blind-prompt"><h3>正解：${escape(q.answer)}</h3><p>${escape(q.explain)}</p>${explanationExtra(q)}<p class="tiny subtle">口に出した答えと模範解答を比べて自己採点しよう。</p><div class="recall-buttons"><button class="btn" data-action="blind-mark" data-correct="yes">○ 正解（+1pt）</button><button class="btn secondary" data-action="blind-mark" data-correct="no">× 不正解（0pt）</button></div></div>`:'')):(lv==='choice'?choiceHtml:writingHtml)}${blind?'':(lv==='choice'?'':selfHtml)}${gradedHtml}
    <div class="quiz-actions"><button class="btn ghost" data-action="leave">中断する</button>${answered?`<button class="btn" data-action="next">${session.current===session.ids.length-1?'結果を見る':'次の問題 →'}</button>`:''}</div>
    </section>`;renderNav();
  }
  function finishAnswer(text,correct,mode,usedHints=0){
    if(!session)return;
    const q=questionMap[session.ids[session.current]];
    if(!q||Object.hasOwn(session.answers,q.id))return;
    const before=pointStats();
    session.answers[q.id]=text||'（未回答）';
    session.results??={};session.results[q.id]=!!correct;
    session.pending=null;
    state.records.push({selfGraded:mode==='blind',rid:(globalThis.crypto?.randomUUID?.()||('r-'+Date.now()+'-'+Math.random().toString(36).slice(2))),id:q.id,correct:!!correct,at:today()+'T'+new Date().toTimeString().slice(0,8),confidence:null,mode,hintsUsed:usedHints});
    state.seen.push(q.id);state.seen=state.seen.slice(-100);
    const after=pointStats();session.pointGains??={};session.pointGains[q.id]=Math.max(0,after.points-before.points);
    if(after.missionCount>before.missionCount)session.missionUnlockedAt=q.id;
    if(after.rewards>before.rewards)session.rewardUnlockedAt=q.id;
    state.session=session;save();quiz();
    requestAnimationFrame(()=>{document.querySelector('#answerExplanation')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'})});
  }
  function blindReveal(){if(!session||session.studyMode!=='blind')return;const id=session.ids[session.current];session.revealed??={};session.revealed[id]=true;state.session=session;save();quiz()}
  function blindMark(correct){if(!session||session.studyMode!=='blind')return;const q=questionMap[session.ids[session.current]];if(!session.revealed?.[q.id]||Object.hasOwn(session.answers,q.id))return;finishAnswer('口頭回答・自己採点',correct,'blind',0);next()}
  function answer(selected){
    if(!session)return;const q=questionMap[session.ids[session.current]];
    if(quizLevel(q)!=='choice')return;
    finishAnswer(selected,q.answer===selected,'choice',0);
  }
  function takeHint(){
    if(!session)return;const q=questionMap[session.ids[session.current]];
    if(quizLevel(q)!=='hint'||session.answers[q.id]!==undefined||session.pending)return;
    session.hints??={};session.hints[q.id]=Math.min(2,(session.hints[q.id]||0)+1);save();quiz();
  }
  function checkWritten(reveal=false){
    if(!session)return;const q=questionMap[session.ids[session.current]],lv=quizLevel(q);
    if(lv==='choice'||Object.hasOwn(session.answers,q.id)||session.pending)return;
    const text=(document.querySelector('#writtenAnswer')?.value||session.drafts?.[q.id]||'').trim();
    session.drafts??={};session.drafts[q.id]=text;save();
    if(!text&&!reveal){const el=document.querySelector('#writtenError');if(el){el.hidden=false;el.textContent='少しでも思いつく言葉を書いてみよう。分からなければ「答えを見る」を押してね。'}return;}
    if(reveal){finishAnswer(text,false,lv,session.hints?.[q.id]||0);return;}
    if(exactWrittenMatch(text,q)){finishAnswer(text,true,lv,session.hints?.[q.id]||0);return;}
    if(q.subject!=='math'){
      session.pending={id:q.id,text};state.session=session;save();quiz();
      requestAnimationFrame(()=>document.querySelector('.self-check')?.scrollIntoView({behavior:'smooth',block:'center'}));
      return;
    }
    finishAnswer(text,false,lv,session.hints?.[q.id]||0);
  }
  function selfMark(correct){
    if(!session?.pending)return;const q=questionMap[session.ids[session.current]];
    if(session.pending.id!==q.id)return;
    finishAnswer(session.pending.text,correct,quizLevel(q),session.hints?.[q.id]||0);
  }
  function confidence(key){const id=session.ids[session.current];session.confidence[id]=key;for(let i=state.records.length-1;i>=0;i--){if(state.records[i].id===id){state.records[i].confidence=key;break}}save();quiz()}
  function next(){const q=questionMap[session.ids[session.current]];if(!Object.hasOwn(session.answers,q.id))return;if(session.current>=session.ids.length-1){session.done=true;state.session=null;save();results()}else{session.current++;save();quiz()}window.scrollTo({top:0,behavior:'smooth'})}
  function results(){page='quiz';const s=session;if(!s){navigate('home');return}const blind=s.studyMode==='blind';const score=s.ids.filter(id=>sessionCorrect(id)).length;const errors=s.ids.filter(id=>!sessionCorrect(id));app.innerHTML=`<section class="card" style="text-align:center"><div class="result-icon">${score>=8?'🌟':'📚'}</div><h1>今回の学習が終了！</h1><div class="big-number">${score} / ${s.ids.length}</div><div class="reward-gain">⭐ このセットで +${Object.values(s.pointGains||{}).reduce((a,b)=>a+(Number(b)||0),0)} pt</div>${s.rewardUnlockedAt?'<div class="reward-unlock"><strong>🎉 報酬獲得！</strong>100 pt達成！</div>':''}<p class="subtle">${blind?'口頭回答を自己採点したよ。間違えた問題を復習しよう！':score>=8?'いい調子！このまま続けよう。':'間違えたところを復習して得点アップ！'}</p><div class="badges" style="justify-content:center"><span class="pill">${SUBJECTS[s.sub]}</span><span class="pill">${s.mode==='wrong'?'間違い直し':s.mode==='weak'?'苦手重点':s.mode==='test'?'テスト形式':'通常'}</span></div></section><div class="section-title"><h2>今回の振り返り</h2></div><section class="card">${errors.length?`<strong>復習したい問題 ${errors.length}問</strong>${errors.map(id=>`<div class="daily-item"><span>${escape(questionMap[id].cat)}：${escape(questionMap[id].q)}</span><span class="pill">要復習</span></div>`).join('')}`:'<p>全問正解！すごい！</p>'}</section><div class="quiz-actions"><button class="btn" data-action="start" data-sub="${s.sub}">もう10問解く</button><button class="btn secondary" data-action="nav" data-page="report">学習記録を見る</button></div>`;renderNav()}
  function radarSVG(sub){const rs=rates(sub),W=440,H=360,cx=220,cy=179,R=123;const pt=(i,r)=>{const a=-Math.PI/2+i*Math.PI/3;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};const pStr=arr=>arr.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');const levels=[.2,.4,.6,.8,1].map(r=>`<polygon points="${pStr(rs.map((_,i)=>pt(i,R*r)))}" stroke="#d9e6e6" stroke-width="1" fill="none"/>`).join('');const axes=rs.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#dfebec"/>`}).join('');const arr=rs.map((r,i)=>pt(i,R*((r.value??0)/100)));const polygon=rs.some(r=>r.value!==null)?`<polygon points="${pStr(arr)}" fill="#32a596" fill-opacity=".25" stroke="#16877d" stroke-width="2.5"/>`:'';const dots=rs.filter(r=>r.value!==null).map(r=>{const [x,y]=pt(rs.indexOf(r),R*r.value/100);return `<circle cx="${x}" cy="${y}" r="4.2" fill="#138b82"/>`}).join('');const labels=rs.map((r,i)=>{const [x,y]=pt(i,R+33);const names=r.cat==='印象派・西洋美術'?['印象派','西洋美術']:r.cat==='木彫・日本画・洋画'?['木彫・日本画','洋画']:r.cat==='式とグラフ'?['式と','グラフ']:r.cat==='モダンテクニック'?['モダン','テクニック']:r.cat==='ジャポニスム'?['ジャポニスム']:r.cat==='変化の割合'?['変化の割合']:r.cat==='グラフ読取'?['グラフ読取']:[r.cat];return `<text x="${x}" y="${y-(names.length-1)*8}" fill="#405f6c" text-anchor="middle" font-size="12" font-weight="650">${names.map((t,j)=>`<tspan x="${x}" dy="${j?15:0}">${escape(t)}</tspan>`).join('')}</text>`}).join('');return `<div class="radar-wrap"><svg viewBox="0 0 ${W} ${H}" class="radar-svg" role="img" aria-label="${SUBJECTS[sub]}の6分野理解度。未学習は0点ではありません。">${levels}${axes}${polygon}${dots}${labels}</svg></div>`}
  function report(){const counts=Object.entries(SUBJECTS).map(([k,n])=>({k,n,...sumStats(k)}));const daily=Object.entries(state.records.reduce((d,r)=>{const day=r.at?.slice(0,10)||'不明';d[day]??={count:0,correct:0};d[day].count++;if(r.correct)d[day].correct++;return d},{})).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);app.innerHTML=`<div class="section-title"><h1 style="margin:0">学習レポート</h1></div>${rewardPanel()}${lotteryPanel()}<section class="stat-row"><div class="stat"><strong>${state.records.length}</strong><span>累計 解答数</span></div><div class="stat"><strong>${counts.filter(x=>x.count>0).length}</strong><span>学習した教科</span></div><div class="stat"><strong>${streak()}</strong><span>連続学習日</span></div></section><div class="section-title"><h2>6分野の理解度</h2></div><div class="button-toggle">${Object.entries(SUBJECTS).map(([k,n])=>`<button class="btn inline ${subject===k?'active':'secondary'}" data-action="report-sub" data-sub="${k}">${n}</button>`).join('')}</div><section class="card" style="margin-top:12px"><h3>${SUBJECTS[subject]} ${sumStats(subject).percent??'未学習'}${sumStats(subject).percent===null?'':'%'} 正答率</h3>${radarSVG(subject)}<p class="subtle tiny">直近最大18回答／分野で集計。まだ解いていない分野は「未学習」で表示します。</p><div class="category-list">${rates(subject).map(r=>`<div class="category-line"><span>${escape(r.cat)}</span><div class="bar-bg"><span class="${r.value!==null&&r.value<50?'low':''}" style="width:${r.value??0}%"></span></div><strong>${r.value===null?'未学習':r.value+'%'}</strong></div>`).join('')}</div></section><div class="section-title"><h2>毎日の学習</h2></div><div class="card daily-list">${daily.length?daily.map(([day,d])=>`<div class="daily-item"><span>${escape(day)}</span><span>${d.count}問・正答率${Math.round(d.correct/d.count*100)}%</span></div>`).join(''):'<p class="empty">今日から学習記録をつけていこう。</p>'}</div>`;renderNav()}
  function settings(){app.innerHTML=`<div class="section-title"><h1 style="margin:0">設定・バックアップ</h1></div><div class="card update-card"><div class="flex between" style="align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin-bottom:5px">アプリの更新</h2><p class="subtle tiny" style="margin:0">新しい問題や機能が追加されたときに最新版を読み込みます。</p></div><span class="pill">v7.3</span></div><button type="button" class="btn update-btn" data-action="refresh-page" aria-label="ページの更新">↻ ページの更新</button><p class="tiny subtle" style="margin:10px 0 0">学習履歴・ポイント・途中の回答は保存されたままです。インターネット接続が必要です。</p></div><div class="card"><h2>iPhone・iPadで記録を引き継ぐ</h2><p class="subtle tiny">このアプリの記録は端末ごとに保存されます。下のボタンで記録をAirDropや「ファイル」に共有し、もう一方の端末で読み込むと、これまでの学習履歴と合体できます。</p><div class="save-buttons"><button class="btn" data-action="share">共有・AirDropで送る</button><button class="btn secondary" data-action="export">記録をファイル保存</button><button class="btn secondary" data-action="import">受け取った記録を合体</button></div><p class="tiny subtle" style="margin-top:12px">① 学習した端末で「共有・AirDropで送る」→ ② もう一方の端末へ送信またはiCloud Driveに保存 → ③ 受信側で「受け取った記録を合体」。<strong>自動同期ではありません。</strong> 両方の記録を最新にするには、必要に応じて両方向で共有してください。</p><p class="tiny subtle">共有するファイルには学習履歴が含まれます。公開SNSなどには投稿しないでください。</p><input id="importFile" type="file" accept="application/json,.json" style="display:none"><hr class="divider"><h3>今回の出題形式</h3><p class="tiny">ホームで4択式とブラインドモードを選べます。ブラインドは口頭回答→解説確認→自己採点→次の問題。正解で1pt、不正解で0ptです。</p><hr class="divider"><h3>ポイント・報酬のルール</h3><p class="tiny">1日につき同じ問題は、4択正解 +1 pt／ブラインド自己採点正解 +1 pt（記述式の過去の記録は配点を維持）（同日・同問題は最高配点まで。復習で同じ段階を正解しても加点されません）。正誤にかかわらず10問解くごとに +3 pt（1日何回でも）。100 ptごとにくじを1回引けます。チケットは端末内に保存され、バックアップにも含まれます。</p><p class="tiny subtle">ポイントは学習履歴から計算しています。以前の学習履歴も引き継ぎ、iPhone・iPad間で記録を合体すると更新されます。</p><hr class="divider"><h3>問題データ</h3><p>数学：${DATA.subjects.math.length}問 ／ 美術：${DATA.subjects.art.length}問（作品画像問題${DATA.subjects.art.filter(q=>q.kind==='image').length}問）</p><p class="tiny subtle">${escape(DATA.note)}</p><details class="qa-details"><summary>学習記録を初期化する（注意）</summary><p class="tiny">この端末の学習履歴を削除します。元に戻せません。バックアップしてから操作してください。</p><button class="btn danger" data-action="reset">学習履歴を削除</button></details></div><div class="section-title"><h2>画像の出典</h2></div><div class="card about"><p class="tiny">作品画像にはWikimedia Commonsの公開ファイルを参照しています。各問題の「画像出典」からファイル情報・利用条件を確認できます。通信が必要です。</p>${DATA.artworks.map(w=>`<small>・<a href="${imgPage(w)}" target="_blank" rel="noopener noreferrer">${escape(w.name)}</a> — ${escape(w.artist)}</small>`).join('')}</div>`;renderNav()}
  function backupFile(){
    const data={app:'manabi-step',version:2,exportedAt:new Date().toISOString(),state:{records:state.records,seen:state.seen,draws:state.draws||[]}};
    return new File([JSON.stringify(data,null,2)],`manabi-step-records-${today()}.json`,{type:'application/json'});
  }
  function exportData(){
    const file=backupFile(),url=URL.createObjectURL(file),a=document.createElement('a');
    a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  }
  function shareData(){
    const file=backupFile();
    if(navigator.share&&navigator.canShare?.({files:[file]})){
      navigator.share({files:[file],title:'まなびステップ 学習履歴',text:'学習履歴を共有します。受信した端末で「設定・バックアップ」→「受け取った記録を合体」から読み込んでください。'}).catch(e=>{if(e?.name!=='AbortError')exportData()});
    }else{
      exportData();
      alert('学習履歴ファイルを保存しました。iPhoneなら「ファイル」アプリからAirDropやiCloud Driveで送ってください。');
    }
  }
  function recordKey(r){return typeof r.rid==='string'&&r.rid?'id:'+r.rid:'legacy:'+r.id+'|'+r.at+'|'+r.correct}
  function importData(file){
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const obj=JSON.parse(reader.result);
        if(obj.app!=='manabi-step'||!Array.isArray(obj.state?.records))throw new Error('形式が異なります');
        const incoming=obj.state.records.filter(r=>r&&typeof r.id==='string'&&questionMap[r.id]&&typeof r.correct==='boolean'&&typeof r.at==='string'&&/^\d{4}-\d{2}-\d{2}T/.test(r.at)).slice(-10000);
        const byKey=new Map(state.records.map(r=>[recordKey(r),r]));
        let added=0,updated=0;
        for(const rec of incoming){
          const k=recordKey(rec);
          if(!byKey.has(k)){byKey.set(k,rec);added++}
          else if(byKey.get(k).confidence==null&&rec.confidence!=null){byKey.set(k,{...byKey.get(k),confidence:rec.confidence});updated++}
        }
        if(!confirm(`バックアップから新しい学習履歴${added}件を追加します。現在の学習履歴は削除しません。よろしいですか？`))return;
        state.records=[...byKey.values()].sort((a,b)=>a.at.localeCompare(b.at)).slice(-10000);
        const importedSeen=Array.isArray(obj.state.seen)?obj.state.seen.filter(id=>questionMap[id]):[];
        state.seen=[...new Set([...state.seen,...importedSeen])].slice(-100);
        // 当選チケットも統合。使用済みの状態を優先し、同じ抽選枠の二重取得を防ぐ。
        const existing=new Map((state.draws||[]).map(d=>[d.slot,d]));
        for(const d of (Array.isArray(obj.state.draws)?obj.state.draws:[])){
          if(!d||!Number.isInteger(d.slot)||d.slot<0||typeof d.id!=='string'||!PRIZES.some(p=>p.id===d.prize))continue;
          const prev=existing.get(d.slot);
          if(!prev)existing.set(d.slot,{id:d.id,slot:d.slot,prize:d.prize,at:String(d.at||''),usedAt:d.usedAt||null});
          else if(d.usedAt&&!prev.usedAt)prev.usedAt=d.usedAt;
        }
        state.draws=[...existing.values()].sort((a,b)=>a.slot-b.slot).slice(0,1000);
        save();
        alert(`取り込み完了！ 新規${added}件、更新${updated}件。合計${state.records.length}件の学習履歴があります。`);
        navigate('report');
      }catch(e){alert('読み込みに失敗しました。まなびステップのJSONバックアップを選択してください。')}
    };
    reader.readAsText(file,'utf-8');
  }
  function render(){renderNav();if(page==='home')app.innerHTML=home();else if(page==='quiz')quiz();else if(page==='report')report();else if(page==='settings')settings();else if(page==='modes')modes(subject)}
  function refreshPage(){
    // ブラウザ内の学習記録を確保してから、毎回異なるURLとして再読み込みする。
    // localStorageを消去したり、学習セッションを初期化したりしない。
    save();
    if(!navigator.onLine){alert('インターネットに接続してから「ページの更新」を押してください。');return;}
    const url=new URL(window.location.href);
    url.searchParams.set('_refresh',String(Date.now()));
    window.location.replace(url.toString());
  }
  document.body.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn){const action=btn.dataset.action;switch(action){case 'nav':navigate(btn.dataset.page);break;case 'lottery-draw':lotteryDraw();break;case 'ticket-use':ticketUse(btn.dataset.ticket);break;case 'study-mode':state.studyMode=btn.dataset.studyMode;save();navigate('home');break;case 'blind-reveal':blindReveal();break;case 'blind-mark':blindMark(btn.dataset.correct==='yes');break;case 'start':start(btn.dataset.sub,btn.dataset.mode||'normal');break;case 'modes':subject=btn.dataset.sub;navigate('modes');break;case 'resume':resume();break;case 'answer':answer(btn.dataset.answer);break;case 'hint':takeHint();break;case 'check-written':checkWritten();break;case 'reveal-written':checkWritten(true);break;case 'self-mark':selfMark(btn.dataset.correct==='yes');break;case 'confidence':confidence(btn.dataset.conf);break;case 'next':next();break;case 'leave':navigate('home');break;case 'report-sub':subject=btn.dataset.sub;report();break;case 'export':exportData();break;case 'share':shareData();break;case 'import':document.querySelector('#importFile').click();break;case 'refresh-page':refreshPage();break;case 'reset':if(confirm('学習履歴をすべて削除します。よろしいですか？')){state={records:[],session:null,seen:[],draws:[]};session=null;save();navigate('home')}break;}return}const nav=e.target.closest('[data-nav]');if(nav){const n=nav.dataset.nav;if(n==='quiz'){if(state.session&&!state.session.done)resume();else{session=null;subject='math';navigate('modes')}}else navigate(n);return}const im=e.target.closest('img[data-image]');if(im){const w=artworks[im.dataset.image],d=document.querySelector('#imageDialog');document.querySelector('#zoomImage').src=imgSrc(w);document.querySelector('#zoomCaption').textContent=`${w.name}／${w.artist}`;d.showModal()}});
  document.body.addEventListener('input',e=>{if(e.target.id==='writtenAnswer'&&session){const id=session.ids[session.current];session.drafts??={};session.drafts[id]=e.target.value;state.session=session;save()}});
  document.body.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='writtenAnswer'&&e.target.tagName==='INPUT'){e.preventDefault();checkWritten()}});
  document.body.addEventListener('change',e=>{if(e.target.id==='importFile'){importData(e.target.files?.[0]);e.target.value=''}});
  document.querySelector('#closeImage')?.addEventListener('click',()=>document.querySelector('#imageDialog').close());
  document.querySelector('#imageDialog')?.addEventListener('click',e=>{if(e.target.tagName==='DIALOG')e.target.close()});
  if(state.session?.ids?.length&&!state.session.done&&state.session.sub in SUBJECTS){session=state.session;subject=session.sub}
  render();
})();

</script>
</body>
</html>
